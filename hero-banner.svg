<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a112f" />
      <stop offset="50%" stop-color="#1a0442" />
      <stop offset="100%" stop-color="#050010" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#6126ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0a0422" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00f0ff" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="26" stdDeviation="36" flood-color="#ff4dff" flood-opacity="0.18" />
    </filter>
    <linearGradient id="text-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dffbff" />
      <stop offset="50%" stop-color="#9ce6ff" />
      <stop offset="100%" stop-color="#f2ccff" />
    </linearGradient>
    <linearGradient id="subtitle-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#b743ff" />
    </linearGradient>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Montserrat:wght@600&display=swap');
      .title { font-family: 'Russo One', 'Montserrat', sans-serif; letter-spacing: 2px; }
      .subtitle { font-family: 'Montserrat', sans-serif; font-weight: 600; letter-spacing: 4px; }
    </style>
  </defs>
  <rect width="1280" height="320" fill="url(#bg-gradient)" rx="36" />
  <g opacity="0.65">
    <circle cx="320" cy="90" r="210" fill="url(#glow)" />
    <circle cx="1040" cy="180" r="240" fill="url(#glow)" />
  </g>
  <g filter="url(#shadow)">
    <text x="640" y="160" text-anchor="middle" font-size="86" fill="url(#text-gradient)" class="title">I.A. Me Clonei</text>
    <text x="640" y="230" text-anchor="middle" font-size="40" fill="url(#subtitle-gradient)" class="subtitle">CURSO DE IA</text>
  </g>
  <rect x="60" y="60" width="1160" height="200" rx="32" stroke="rgba(0,240,255,0.22)" stroke-width="2" fill="none" />
  <rect x="90" y="90" width="1100" height="140" rx="28" stroke="rgba(255,77,255,0.16)" stroke-width="1.5" fill="none" />
</svg>
